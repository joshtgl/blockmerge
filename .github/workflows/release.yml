name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify release artifacts without publishing them
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release unpublished crate
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.release_plz.outputs.releases }}
      releases_created: ${{ steps.release_plz.outputs.releases_created }}
      artifact_version: ${{ steps.release_mode.outputs.artifact_version }}
      should_build_artifacts: ${{ steps.release_mode.outputs.should_build_artifacts }}
      should_publish_artifacts: ${{ steps.release_mode.outputs.should_publish_artifacts }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run release-plz release
        id: release_plz
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
          version: 0.3.158
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release mode
        id: release_mode
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RELEASES: ${{ steps.release_plz.outputs.releases }}
          RELEASES_CREATED: ${{ steps.release_plz.outputs.releases_created }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
            echo "artifact_version=$version" >> "$GITHUB_OUTPUT"
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "should_publish_artifacts=false" >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASES_CREATED" == "true" ]]; then
            version="$(jq -r '.[0].version' <<< "$RELEASES")"
            echo "artifact_version=$version" >> "$GITHUB_OUTPUT"
            echo "should_build_artifacts=true" >> "$GITHUB_OUTPUT"
            echo "should_publish_artifacts=true" >> "$GITHUB_OUTPUT"
          else
            echo "artifact_version=" >> "$GITHUB_OUTPUT"
            echo "should_build_artifacts=false" >> "$GITHUB_OUTPUT"
            echo "should_publish_artifacts=false" >> "$GITHUB_OUTPUT"
          fi

  release-pr:
    name: Create or update release PR
    needs: release
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run release-plz release-pr
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
          version: 0.3.158
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-artifacts:
    name: Build release artifacts
    needs: release
    if: needs.release.outputs.should_build_artifacts == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      repository: ${{ github.repository }}
      ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.artifact_version }}
      publish_artifacts: ${{ fromJSON(needs.release.outputs.should_publish_artifacts) }}

  publish-static-binaries:
    name: Publish static release binaries
    needs:
      - release
      - release-artifacts
    if: needs.release.outputs.should_publish_artifacts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download static binary artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: static-binaries-x86_64-unknown-linux-musl
          path: dist/static

      - name: Upload static binaries to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ fromJSON(needs.release.outputs.releases)[0].tag }}
          files: |
            dist/static/*.tar.gz
            dist/static/*.cdx.json
          fail_on_unmatched_files: true
