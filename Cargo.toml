[package]
name = "blockmerge"
version = "0.1.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Retrieve, merge, and generate inbound and outbound IP blocklists"
authors = [
  "Josh <git@bnhtech.com",
]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
csv = "1.4.0"
etcetera = "0.11"
globset = "0.4.20"
hex = "0.4.3"
http = "1.5.0"
ipnet = "2.12.1"
regex-lite = "0.1.9"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
static-web-server = { version = "2.44.0", default-features = false, features = ["directory-listing"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-cron-scheduler = "0.15.1"
toml = "1.1.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
mockito = "1.7.2"
